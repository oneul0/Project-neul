spring:
  application:
    name: collector
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]
  kafka:
    bootstrap-servers: 127.0.0.1:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: 127.0.0.1
      port: 6379

server:
  port: 8081

chzzk:
  api:
    base-url: https://openapi.chzzk.naver.com
    auth-url: https://chzzk.naver.com
    vod-chat-url: https://api.chzzk.naver.com/service/v1/videos/{videoNo}/chats
    vod-metadata-url: https://api.chzzk.naver.com/service/v2/videos/{videoNo}
    client-id: ${CHZZK_CLIENT_ID}
    client-secret: ${CHZZK_CLIENT_SECRET}
    redirect-uri: ${CHZZK_REDIRECT_URI:http://localhost:8081/api/v1/chzzk/callback}

neul:
  owner-token-secret: ${NEUL_OWNER_TOKEN_SECRET:dev-owner-token-secret}
  frontend-url: ${NEUL_FRONTEND_URL:http://localhost:3000}
  token:
    max-age-seconds: ${NEUL_TOKEN_MAX_AGE_SECONDS:3600}

resilience4j:
  retry:
    instances:
      chzzkSession:
        max-attempts: 5
        wait-duration: 5s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
