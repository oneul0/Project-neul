spring:
  application:
    name: collector
  kafka:
    bootstrap-servers: 127.0.0.1:9092 # Docker에서 설정한 외부 포트
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8081

# Chzzk Open API 설정 (환경변수로 주입: 코드/Git에 직접 기재 금지)
chzzk:
  api:
    base-url: https://openapi.chzzk.naver.com
    auth-url: https://chzzk.naver.com
    client-id: ${CHZZK_CLIENT_ID}
    client-secret: ${CHZZK_CLIENT_SECRET}
    redirect-uri: http://127.0.0.1:8081/api/v1/chzzk/callback

# Resilience4j Retry 설정 (Chzzk Socket.IO 재연결)
resilience4j:
  retry:
    instances:
      chzzkSession:
        max-attempts: 5
        wait-duration: 5s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
