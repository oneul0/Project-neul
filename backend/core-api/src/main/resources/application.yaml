spring:
  application:
    name: core-api

  r2dbc:
    url: r2dbc:postgresql://127.0.0.1:5432/neul_db
    username: neul_user
    password: neul_password

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  kafka:
    bootstrap-servers: 127.0.0.1:9092

server:
  port: 8083
  error:
    include-message: always
    include-stacktrace: always

# Chzzk Open API 설정 (환경변수로 주입)
chzzk:
  api:
    base-url: https://openapi.chzzk.naver.com
    client-id: ${CHZZK_CLIENT_ID}
    client-secret: ${CHZZK_CLIENT_SECRET}
