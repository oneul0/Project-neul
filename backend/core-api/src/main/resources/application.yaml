spring:
  application:
    name: core-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]

  r2dbc:
    url: r2dbc:postgresql://${NEUL_POSTGRES_HOST:127.0.0.1}:${NEUL_POSTGRES_HOST_PORT:5432}/${NEUL_POSTGRES_DB:neul_db}
  flyway:
    enabled: true
    url: jdbc:postgresql://${NEUL_POSTGRES_HOST:127.0.0.1}:${NEUL_POSTGRES_HOST_PORT:5432}/${NEUL_POSTGRES_DB:neul_db}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  sql:
    init:
      mode: never

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  kafka:
    bootstrap-servers: 127.0.0.1:9092
    consumer:
      auto-offset-reset: earliest

server:
  port: 8083
  error:
    include-message: always
    include-stacktrace: never

app:
  chzzk:
    live-status-base-url: https://api.chzzk.naver.com/service/v2/channels
  collector:
    base-url: http://localhost:8081
  ollama:
    embed-url: ${OLLAMA_EMBED_URL:http://127.0.0.1:11434/api/embeddings}
    embed-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}

# 개발 전용 시드 엔드포인트 (.env 에 NEUL_DEV_SEED_ENABLED=true 추가 시 활성화)
neul:
  dev-seed:
    enabled: ${NEUL_DEV_SEED_ENABLED:false}
  owner-token-secret: ${NEUL_OWNER_TOKEN_SECRET:dev-owner-token-secret}
  internal-api-secret: ${NEUL_INTERNAL_API_SECRET:dev-internal-secret}
  cors:
    allowed-origins: ${NEUL_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Chzzk Open API 설정 (환경변수로 주입)
chzzk:
  api:
    base-url: https://openapi.chzzk.naver.com
    client-id: ${CHZZK_CLIENT_ID}
    client-secret: ${CHZZK_CLIENT_SECRET}
