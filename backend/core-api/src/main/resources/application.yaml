spring:
  application:
    name: core-api
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
      - optional:file:../../.env[.properties]

  r2dbc:
    url: r2dbc:postgresql://${NEUL_POSTGRES_HOST:127.0.0.1}:${NEUL_POSTGRES_HOST_PORT:5432}/${NEUL_POSTGRES_DB:neul_db}
    username: ${NEUL_POSTGRES_USER:neul_user}
    password: ${NEUL_POSTGRES_PASSWORD:neul_password}
  flyway:
    enabled: true
    url: jdbc:postgresql://${NEUL_POSTGRES_HOST:127.0.0.1}:${NEUL_POSTGRES_HOST_PORT:5432}/${NEUL_POSTGRES_DB:neul_db}
    user: ${NEUL_POSTGRES_USER:neul_user}
    password: ${NEUL_POSTGRES_PASSWORD:neul_password}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
  sql:
    init:
      mode: never

  data:
    redis:
      host: 127.0.0.1
      port: 6379

  kafka:
    bootstrap-servers: 127.0.0.1:9092
    consumer:
      auto-offset-reset: earliest

server:
  port: 8083
  error:
    include-message: always
    include-stacktrace: always

app:
  chzzk:
    live-status-base-url: https://api.chzzk.naver.com/service/v2/channels
  collector:
    base-url: http://localhost:8081

# Chzzk Open API 설정 (환경변수로 주입)
chzzk:
  api:
    base-url: https://openapi.chzzk.naver.com
    client-id: ${CHZZK_CLIENT_ID}
    client-secret: ${CHZZK_CLIENT_SECRET}
