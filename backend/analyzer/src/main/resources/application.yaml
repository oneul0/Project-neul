spring:
  application:
    name: analyzer

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

server:
  port: 8082

app:
  optimizer:
    # 'java': JavaChatOptimizer (현재 운용)
    # 'rust': RustChatOptimizer (JNI — Rust 모듈 완성 후 전환)
    engine: java
  ollama:
    api-url: ${OLLAMA_API_URL:http://127.0.0.1:11434/api/chat}
    model: gemma:2b
    prompts:
      sentiment-system: classpath:prompts/ollama-sentiment-system.txt
      sentiment-user: classpath:prompts/ollama-sentiment-user.txt
      highlight-system: classpath:prompts/ollama-highlight-system.txt
      highlight-user: classpath:prompts/ollama-highlight-user.txt
  core-api:
    base-url: ${CORE_API_BASE_URL:http://127.0.0.1:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    metrics:
      enabled: true

gak:
  internal-api-secret: ${GAK_INTERNAL_API_SECRET:dev-gak-internal-secret}
