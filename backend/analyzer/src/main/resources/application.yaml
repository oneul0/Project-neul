spring:
  application:
    name: analyzer
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: analyzer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.neul.common.dto"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Gemini API 설정 (실행 시 환경변수 또는 직접 입력)
gemini:
  api:
    key: "" # 여기에 Gemini API Key를 입력하거나 환경변수로 전달하세요.
    url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent"

server:
  port: 8082