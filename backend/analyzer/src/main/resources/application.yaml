spring:
  application:
    name: analyzer

  kafka:
    bootstrap-servers: 127.0.0.1:9092

  data:
    redis:
      host: 127.0.0.1
      port: 6379

server:
  port: 8082

app:
  optimizer:
    # 'java': JavaChatOptimizer (현재 운용)
    # 'rust': RustChatOptimizer (JNI — Rust 모듈 완성 후 전환)
    engine: java
  ollama:
    api-url: http://127.0.0.1:11434/api/chat
    model: gemma:2b
