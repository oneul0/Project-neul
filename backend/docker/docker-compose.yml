services:
  # 1. PostgreSQL (관계형 데이터베이스 - 방송 이력 및 통계 저장)
  postgres:
    image: postgres:15-alpine
    container_name: neul-postgres
    ports:
      - "${NEUL_POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: neul_user
      POSTGRES_PASSWORD: neul_password
      POSTGRES_DB: neul_db
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - neul-network
    restart: unless-stopped

  # 2. Redis (인메모리 데이터 저장소 - 실시간 감정 지표 집계 및 분산 환경 Pub/Sub)
  redis:
    image: redis:7-alpine
    container_name: neul-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - neul-network
    restart: unless-stopped

  # 3. Apache Kafka (공식 이미지 - KRaft 모드)
  kafka:
    image: apache/kafka:4.1.0 # 최신 안정 버전 사용
    container_name: neul-kafka
    ports:
      - "9094:9094"
    environment:
      # Apache 공식 이미지는 KAFKA_CFG_ 대신 KAFKA_ 형식을 사용합니다.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'controller,broker'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - neul-network
    restart: unless-stopped

  # 4. Kafka UI (Kafka 토픽 및 메시지를 웹에서 편리하게 모니터링하기 위한 도구)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: neul-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: neul-local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      # 기본적으로 필요한 토픽을 UI에서 쉽게 생성/관리할 수 있습니다.
    depends_on:
      - kafka
    networks:
      - neul-network
    restart: unless-stopped

# 데이터 영속성을 위한 볼륨 선언 (컨테이너가 삭제되어도 데이터는 유지됨)
volumes:
  postgres-data:
  redis-data:
  kafka-data:

# 서비스 간 통신을 위한 격리된 네트워크
networks:
  neul-network:
    driver: bridge
