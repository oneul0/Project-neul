# -------------------------------------------------------
# Production Docker Compose
# 사용 전: .env.prod 파일 생성 (.env.prod.example 참고)
#
# 실행:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# 빌드:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod build
# -------------------------------------------------------

services:

  # ── Infrastructure ──────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg15
    container_name: gak-postgres
    environment:
      POSTGRES_USER: ${GAK_POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${GAK_POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: ${GAK_POSTGRES_DB}
      GAK_POSTGRES_APP_USER: ${GAK_POSTGRES_APP_USER}
      GAK_POSTGRES_APP_PASSWORD: ${GAK_POSTGRES_APP_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/docker/init-app-user.sh:/docker-entrypoint-initdb.d/01_init_app_user.sh:ro
    networks:
      - gak-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GAK_POSTGRES_ADMIN_USER} -d ${GAK_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gak-redis
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - gak-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:4.1.0
    container_name: gak-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 컨테이너 내부 통신만 사용 (외부 노출 없음)
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - gak-network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: gak-ollama
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - gak-network
    restart: unless-stopped
    # 모델 자동 다운로드 (최초 기동 시)
    # 완료 후 ollama-init 컨테이너는 자동 종료됨

  ollama-init:
    image: ollama/ollama:latest
    container_name: gak-ollama-init
    depends_on:
      - ollama
    networks:
      - gak-network
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: /bin/sh
    command: >
      -c "
        echo 'Waiting for Ollama...'; sleep 15;
        ollama pull gemma:2b;
        ollama pull nomic-embed-text;
        echo 'Models ready.'
      "
    restart: on-failure

  # ── Application Services ────────────────────────────

  core-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: core-api
        PORT: 8083
    container_name: gak-core-api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Database
      GAK_POSTGRES_HOST: postgres
      GAK_POSTGRES_HOST_PORT: 5432
      GAK_POSTGRES_DB: ${GAK_POSTGRES_DB}
      GAK_POSTGRES_APP_USER: ${GAK_POSTGRES_APP_USER}
      GAK_POSTGRES_APP_PASSWORD: ${GAK_POSTGRES_APP_PASSWORD}
      GAK_POSTGRES_ADMIN_USER: ${GAK_POSTGRES_ADMIN_USER}
      GAK_POSTGRES_ADMIN_PASSWORD: ${GAK_POSTGRES_ADMIN_PASSWORD}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Chzzk API
      CHZZK_CLIENT_ID: ${CHZZK_CLIENT_ID}
      CHZZK_CLIENT_SECRET: ${CHZZK_CLIENT_SECRET}
      # App secrets
      GAK_OWNER_TOKEN_SECRET: ${GAK_OWNER_TOKEN_SECRET}
      GAK_INTERNAL_API_SECRET: ${GAK_INTERNAL_API_SECRET}
      GAK_CORS_ALLOWED_ORIGINS: ${GAK_CORS_ALLOWED_ORIGINS}
      # Ollama
      OLLAMA_EMBED_URL: http://ollama:11434/api/embeddings
      OLLAMA_EMBED_MODEL: nomic-embed-text
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - gak-network
    restart: unless-stopped

  collector:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: collector
        PORT: 8081
    container_name: gak-collector
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Chzzk API
      CHZZK_CLIENT_ID: ${CHZZK_CLIENT_ID}
      CHZZK_CLIENT_SECRET: ${CHZZK_CLIENT_SECRET}
      CHZZK_REDIRECT_URI: ${CHZZK_REDIRECT_URI}
      # App config
      GAK_OWNER_TOKEN_SECRET: ${GAK_OWNER_TOKEN_SECRET}
      GAK_FRONTEND_URL: ${GAK_FRONTEND_URL}
      CORE_API_BASE_URL: http://core-api:8083
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - gak-network
    restart: unless-stopped

  analyzer:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MODULE: analyzer
        PORT: 8082
    container_name: gak-analyzer
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # Kafka
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # Ollama
      OLLAMA_API_URL: http://ollama:11434/api/chat
      # core-api
      CORE_API_BASE_URL: http://core-api:8083
      GAK_INTERNAL_API_SECRET: ${GAK_INTERNAL_API_SECRET}
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_healthy
      core-api:
        condition: service_started
    networks:
      - gak-network
    restart: unless-stopped

  # ── Reverse Proxy ───────────────────────────────────
  # 프론트엔드는 Vercel에서 서빙 (이 Compose에 포함되지 않음)

  nginx:
    image: nginx:alpine
    container_name: gak-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
    depends_on:
      - core-api
      - collector
    networks:
      - gak-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    container_name: gak-certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    # 수동 실행: docker compose run --rm certbot certonly --webroot ...
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  ollama-data:
  certbot-www:
  certbot-certs:

networks:
  gak-network:
    driver: bridge
